services:
  db:
    image: postgis/postgis:17-3.5
    container_name: reach-db
    environment:
      POSTGRES_DB: reach
      POSTGRES_USER: ${POSTGRES_USER:?Missing administrator username in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing administrator password in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d reach"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
